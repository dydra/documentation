document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3d96ab9e-934b-4979-b117-4c18a35e1be9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html { -webkit-font-smoothing: antialiased; }\n  body { background: #fafafa; color: #111; font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif; }\n  ::selection { background: #111; color: #fafafa; }\n  a { color: inherit; text-decoration: none; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1280px; margin:0 auto; background:#fafafa; min-height:100vh; border-left:1px solid #ddd; border-right:1px solid #ddd; padding-top:118px; padding-bottom:94px;\">\n\n  <!-- MASTHEAD -->\n  <header style=\"position:fixed; top:0; left:0; right:0; max-width:1280px; margin:0 auto; z-index:50; background:#fafafa; border-left:1px solid #ddd; border-right:1px solid #ddd; border-bottom:7px solid #111; padding:22px 56px 16px; display:grid; grid-template-columns:1fr auto; align-items:end;\">\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.36em; text-transform:uppercase; margin-bottom:10px;\">Graph Database · Triple Store<\u002Fdiv>\n      <div style=\"font-size:46px; font-weight:700; letter-spacing:-0.03em; line-height:0.9;\">dydra<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex; gap:34px; font-size:13px; letter-spacing:0.04em; padding-bottom:6px;\">\n      <a href=\"#what\" style-hover=\"opacity:0.5;\">What it is<\u002Fa>\n      <a href=\"#service\" style-hover=\"opacity:0.5;\">Service<\u002Fa>\n      <a href=\"#scale\" style-hover=\"opacity:0.5;\">Scale<\u002Fa>\n      <a href=\"#start\" style=\"font-weight:700;\" style-hover=\"opacity:0.5;\">Sign in<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"padding:0 56px; border-bottom:1px solid #111;\">\n    <div style=\"display:grid; grid-template-columns:88px 1fr; min-height:560px;\">\n      <!-- left rail -->\n      <div style=\"border-right:1px solid #111; display:flex; flex-direction:column; justify-content:space-between; padding:30px 0;\">\n        <div style=\"font-size:12px; letter-spacing:0.3em; writing-mode:vertical-rl; transform:rotate(180deg); text-transform:uppercase;\">dydra.com<\u002Fdiv>\n        <div style=\"font-size:64px; font-weight:300; line-height:0.8;\">01<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- headline column -->\n      <div style=\"padding:48px 0 48px 48px; display:flex; flex-direction:column; justify-content:center;\">\n        <h1 style=\"font-size:96px; font-weight:700; line-height:0.92; letter-spacing:-0.04em; max-width:14ch; text-wrap:balance;\">Every fact, one triple at a time.<\u002Fh1>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:54px; max-width:760px;\">\n          <p style=\"font-size:17px; line-height:1.5; max-width:34ch;\">Dydra is a hosted graph database — a triple store you query with full SPARQL 1.1, no servers to run, no schema to migrate.<\u002Fp>\n          <div style=\"border-left:1px solid #111; padding-left:24px;\">\n            <div style=\"font-size:11px; letter-spacing:0.24em; text-transform:uppercase; margin-bottom:14px;\">Available now<\u002Fdiv>\n            <a href=\"#start\" style=\"display:inline-block; background:#111; color:#fafafa; font-size:15px; font-weight:700; letter-spacing:0.04em; padding:15px 30px;\" style-hover=\"background:#fafafa; color:#111; box-shadow:inset 0 0 0 2px #111;\">Open a free account →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TICKER RULE -->\n  <div style=\"border-bottom:1px solid #111; display:flex; align-items:stretch; font-size:12px; letter-spacing:0.16em; text-transform:uppercase;\">\n    <div style=\"padding:13px 56px; border-right:1px solid #111; font-weight:700;\">SPARQL 1.1<\u002Fdiv>\n    <div style=\"padding:13px 28px; border-right:1px solid #111;\">RDF 1.2 — pre-alpha<\u002Fdiv>\n    <div style=\"padding:13px 28px; border-right:1px solid #111;\">Named graphs<\u002Fdiv>\n    <div style=\"padding:13px 28px; border-right:1px solid #111;\">Federated query<\u002Fdiv>\n    <div style=\"padding:13px 28px; margin-left:auto; font-weight:700;\">Free account at dydra.com<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WHAT IT IS -->\n  <section id=\"what\" style=\"padding:0 56px; border-bottom:7px solid #111;\">\n    <div style=\"display:grid; grid-template-columns:88px 1fr;\">\n      <div style=\"border-right:1px solid #111; padding:40px 0; display:flex; flex-direction:column; justify-content:space-between;\">\n        <div style=\"font-size:64px; font-weight:300; line-height:0.8;\">02<\u002Fdiv>\n        <div style=\"font-size:12px; letter-spacing:0.3em; writing-mode:vertical-rl; transform:rotate(180deg); text-transform:uppercase;\">The standard<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:56px 0 56px 48px;\">\n        <h2 style=\"font-size:15px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; margin-bottom:48px;\">A database built on the open web stack<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#111; border:1px solid #111;\">\n          <div style=\"background:#fafafa; padding:34px 28px 40px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:16px; padding-bottom:12px; border-bottom:3px solid #111;\">SPARQL 1.1, in full<\u002Fdiv>\n            <p style=\"font-size:15px; line-height:1.55;\">Query, update, federate. The complete specification — not a subset — so the queries you write are the queries that run.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fafafa; padding:34px 28px 40px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:16px; padding-bottom:12px; border-bottom:3px solid #111;\">RDF 1.2, early<\u002Fdiv>\n            <p style=\"font-size:15px; line-height:1.55;\">A pre-alpha of RDF 1.2 with quoted triples, putting statements about statements within reach today.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fafafa; padding:34px 28px 40px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:16px; padding-bottom:12px; border-bottom:3px solid #111;\">Hosted, entirely<\u002Fdiv>\n            <p style=\"font-size:15px; line-height:1.55;\">No installation, no operations. Create an account, load your data, and query over HTTP from anywhere.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- SPARQL EXAMPLE -->\n        <div style=\"margin-top:48px;\">\n          <div style=\"display:grid; grid-template-columns:auto 1fr; align-items:end; gap:20px; margin-bottom:0; border-bottom:3px solid #111; padding-bottom:14px;\">\n            <div style=\"font-size:13px; font-weight:700; letter-spacing:0.24em; text-transform:uppercase;\">One request, counted<\u002Fdiv>\n            <div style=\"font-size:12px; letter-spacing:0.08em; text-align:right;\">HTTP · SPARQL · JSON<\u002Fdiv>\n          <\u002Fdiv>\n          <pre style=\"background:#111; color:#fafafa; font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace; font-size:14px; line-height:1.65; padding:30px 34px; margin-top:0; overflow-x:auto; white-space:pre;\"><span style=\"opacity:0.5;\">$<\u002Fspan> curl https://dydra.com/me/foaf/sparql \\\n  --data-urlencode <span style=\"font-weight:700;\">'query=SELECT (COUNT(*) AS ?n) WHERE { ?s ?p ?o }'<\u002Fspan> \\\n  -H 'Accept: application/json'\n\n[ { \"n\": 631 } ]<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SERVICE: PUBLIC vs DEDICATED -->\n  <section id=\"service\" style=\"border-bottom:1px solid #111;\">\n    <div style=\"display:grid; grid-template-columns:1fr 1fr;\">\n      <div style=\"padding:56px 48px 60px 56 ; font-weight:300; line-height:0.8;\">05<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:64px 0 64px 48px;\">\n        <div style=\"font-size:13px; letter-spacing:0.24em; text-transform:uppercase; margin-bottom:24px;\">New backend<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.3fr 1fr; gap:56px; align-items:end;\">\n          <h2 style=\"font-size:72px; font-weight:700; line-height:0.9; letter-spacing:-0.035em;\">Now scaling into the billions.<\u002Fh2>\n          <div style=\"border-left:1px solid #111; padding-left:28px;\">\n            <div style=\"font-size:64px; font-weight:700; line-height:0.85; letter-spacing:-0.04em;\">10⁹+<\u002Fdiv>\n            <div style=\"font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-top:10px;\">triples per store<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:17px; line-height:1.55; max-width:58ch; margin-top:38px;\">A new data backend built on <strong>RonDB<\u002Fstrong> carries Dydra past the limits of a single node — distributed, in-memory, and engineered for stores in the billion-triple range without changing a line of your SPARQL.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section id=\"start\" style=\"border-bottom:7px solid #111; background:#111; color:#fafafa; padding:72px 56px 80px;\">\n    <div style=\"display:grid; grid-template-columns:1fr auto; align-items:end; gap:40px;\">\n      <h2 style=\"font-size:80px; font-weight:700; line-height:0.86; letter-spacing:-0.04em; max-width:16ch;\">Load your first graph today.<\u002Fh2>\n      <div style=\"display:flex; flex-direction:column; gap:14px; min-width:260px;\">\n        <a href=\"https://dydra.com\" style=\"background:#fafafa; color:#111; font-size:16px; font-weight:700; letter-spacing:0.03em; padding:18px 30px; text-align:center;\" style-hover=\"opacity:0.85;\">Create a free account<\u002Fa>\n        <a href=\"#service\" style=\"border:1px
